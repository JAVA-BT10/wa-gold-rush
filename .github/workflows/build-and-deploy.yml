name: Build and Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate runtime config
        env:
          WA_GGR_API_KEY: ${{ secrets.WA_GGR_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          api_key = os.environ.get("WA_GGR_API_KEY", "").strip()
          if not api_key:
              raise SystemExit("WA_GGR_API_KEY secret is required to deploy teacher/runtime-config.js")

          runtime_config_path = Path("teacher/runtime-config.js")
          runtime_config_path.write_text(
              "window.WA_GOLD_RUSH_RUNTIME_CONFIG = {\n"
              f"  apiKey: {json.dumps(api_key)}\n"
              "};\n",
              encoding="utf-8",
          )
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
