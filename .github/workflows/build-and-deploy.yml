name: Build and Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate runtime config
        env:
          WA_GGR_API_KEY: ${{ secrets.WA_GGR_API_KEY }}
          WA_GGR_RUNTIME_CONFIG_VERSION: ${{ github.run_id }}-${{ github.run_attempt }}
          WA_GGR_PAGES_BUILD_DIR: pages-dist
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import shutil

          api_key = os.environ.get("WA_GGR_API_KEY", "").strip()
          if not api_key:
              raise SystemExit("WA_GGR_API_KEY secret is required to deploy teacher/runtime-config.js")
          runtime_config_version = os.environ.get("WA_GGR_RUNTIME_CONFIG_VERSION", "").strip()
          if not runtime_config_version or runtime_config_version == "dev":
              raise SystemExit("WA_GGR_RUNTIME_CONFIG_VERSION must be a non-dev build marker")
          build_dir = Path(os.environ.get("WA_GGR_PAGES_BUILD_DIR", "").strip() or "pages-dist")
          runtime_config_version_token = "__WA_GGR_RUNTIME_CONFIG_VERSION__"
          artifact_sources = [
              Path("index.html"),
              Path("script.js"),
              Path("levels"),
              Path("shared"),
              Path("teacher"),
          ]

          if build_dir.exists():
              shutil.rmtree(build_dir)
          build_dir.mkdir(parents=True, exist_ok=True)
          for source in artifact_sources:
              destination = build_dir / source
              if source.is_dir():
                  shutil.copytree(source, destination)
              else:
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, destination)
          (build_dir / ".nojekyll").write_text("", encoding="utf-8")

          runtime_config_path = build_dir / "teacher/runtime-config.js"
          runtime_config_path.write_text(
              "(function initRuntimeConfig(windowObj) {\n"
              "  const existingRuntimeConfig = windowObj.WA_GOLD_RUSH_RUNTIME_CONFIG || {};\n"
              "  const apiKey = String("
              + json.dumps(api_key)
              + " || '').trim();\n"
              "  windowObj.WA_GOLD_RUSH_RUNTIME_CONFIG = {\n"
              "    ...existingRuntimeConfig,\n"
              "    apiKey,\n"
              "    buildTarget: 'github-pages',\n"
              f"    version: {json.dumps(runtime_config_version)}\n"
              "  };\n"
              "  windowObj.WA_GOLD_RUSH_POWER_AUTOMATE_CONFIG = windowObj.WA_GOLD_RUSH_POWER_AUTOMATE_CONFIG || {};\n"
              "  if (apiKey) {\n"
              "    windowObj.WA_GOLD_RUSH_POWER_AUTOMATE_CONFIG.apiKey = apiKey;\n"
              "  }\n"
              "  windowObj.WA_GOLD_RUSH_RUNTIME_CONFIG_SCRIPT_LOADED = true;\n"
              "})(window);\n",
              encoding="utf-8",
          )

          html_paths = sorted(build_dir.rglob("*.html"))
          replaced_html_paths = []
          for html_path in html_paths:
              html = html_path.read_text(encoding="utf-8")
              if runtime_config_version_token in html:
                  html_path.write_text(
                      html.replace(runtime_config_version_token, runtime_config_version),
                      encoding="utf-8",
                  )
                  replaced_html_paths.append(html_path)
          if not replaced_html_paths:
              raise SystemExit("Missing runtime config version token in built HTML files")
          PY

      - name: Verify Pages artifact contents
        env:
          WA_GGR_RUNTIME_CONFIG_VERSION: ${{ github.run_id }}-${{ github.run_attempt }}
          WA_GGR_PAGES_BUILD_DIR: pages-dist
        run: |
          python - <<'PY'
          import os
          import subprocess
          import tarfile
          from pathlib import Path

          runtime_config_version = os.environ.get("WA_GGR_RUNTIME_CONFIG_VERSION", "").strip()
          build_dir = Path(os.environ.get("WA_GGR_PAGES_BUILD_DIR", "").strip() or "pages-dist")
          runtime_config_path = build_dir / "teacher/runtime-config.js"
          runtime_config = runtime_config_path.read_text(encoding="utf-8")

          required_runtime_fragments = (
              "const apiKey = String(",
              "apiKey,",
              "buildTarget: 'github-pages'",
              f"version: {runtime_config_version!r}",
              "windowObj.WA_GOLD_RUSH_POWER_AUTOMATE_CONFIG.apiKey = apiKey;",
          )
          for fragment in required_runtime_fragments:
              if fragment not in runtime_config:
                  raise SystemExit(f"Generated runtime config is missing required fragment: {fragment}")
          if "version: existingRuntimeConfig.version || 'dev'" in runtime_config:
              raise SystemExit("Generated runtime config still contains the development stub version")
          if "__WA_GGR_RUNTIME_CONFIG_VERSION__" in runtime_config:
              raise SystemExit("Generated runtime config still contains the version placeholder token")
          if "String(\"\" || '').trim()" in runtime_config or "String('' || '').trim()" in runtime_config:
              raise SystemExit("Generated runtime config must include a non-empty API key")

          expected_html_runtime_paths = {
              build_dir / "index.html": f'teacher/runtime-config.js?v={runtime_config_version}',
              build_dir / "teacher/dashboard.html": f'runtime-config.js?v={runtime_config_version}',
              build_dir / "levels/level-2-tycoon/index.html": f'../../teacher/runtime-config.js?v={runtime_config_version}',
          }
          for html_path, expected_runtime_path in expected_html_runtime_paths.items():
              html = html_path.read_text(encoding="utf-8")
              if expected_runtime_path not in html:
                  raise SystemExit(f"Built HTML does not reference cache-busted runtime config: {html_path}")
              if "__WA_GGR_RUNTIME_CONFIG_VERSION__" in html:
                  raise SystemExit(f"Built HTML still contains the runtime config version placeholder: {html_path}")

          archive_path = Path(os.environ.get("RUNNER_TEMP", ".")).resolve() / "pages-artifact-verify.tar"
          if archive_path.exists():
              archive_path.unlink()
          subprocess.run(
              [
                  "tar",
                  "--dereference",
                  "--hard-dereference",
                  "--directory",
                  str(build_dir),
                  "-cvf",
                  str(archive_path),
                  "--exclude=.git",
                  "--exclude=.github",
                  ".",
              ],
              check=True,
              capture_output=True,
              text=True,
          )
          with tarfile.open(archive_path, mode="r") as archive:
              member = next(
                  (
                      candidate
                      for candidate in archive.getmembers()
                      if candidate.name.lstrip("./") == "teacher/runtime-config.js"
                  ),
                  None,
              )
              if member is None:
                  raise SystemExit("Packaged Pages artifact does not contain teacher/runtime-config.js")
              archived_runtime_config = archive.extractfile(member).read().decode("utf-8")
              if archived_runtime_config != runtime_config:
                  raise SystemExit("Packaged Pages artifact runtime config does not match the generated file")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
